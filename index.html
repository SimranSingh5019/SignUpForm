<!DOCTYPE html>
<html lang="en">
<head>
    <link rel = "stylesheet" href = "styles.css">
    <title>Document</title>
</head>
<body>
    <div class = "parentContainer">
        <div class = "container-1">
           <div>
              <p>ODIN</p>
           </div>
        </div>
        <div class = "container-2">
            <p>"If debugging is the process of removing software bugs, then programming must be the process of putting them in."
                Edsger Dijkstra</p>
            
            
                <form action="" method = "">
                    <div class = "signUp">
                        <div class = "Name">
                            <div class = "FirstName">
                                <label for = "first_name">FIRST NAME </label>
                                
                                <input type = "text" id = "first_name" name = "first_name">
                            
                            </div>
                            <div>
                                <label for ="last_name">LAST NAME</label>
                                <input type = "text" id = "last_name" name = "last_name">
                                
                            </div>
                        </div>
                        
                        
                       <div class = "Details">
                            <div>
                                <label for = "emailid">EMAIL</label>

                                <input type = "email" id = "emailid" name = "emailid">
                            
                            </div>
                            <div>
                            
                                <label for = "phoneno">PHONE NUMBER</label>

                                <input type = "number" id = "phoneno" name = "phoneno" max = 10>
                            </div>
                       </div>
                        <div class = "Pword">
                            <div>
                                <label for = "password">PASSWORD</label>

                                <input type = "password" id = "password" name = "password" minlength="8">
                            </div>
                            <div>
                                <label for = "password_cnf">CONFIRM PASSWORD</label>

                                <input type = "password" id = "password_cnf" name = "password_cnf" minlength="8">
                            </div>
                        </div>
                      
                       
                    </div>
                    
                   
                    
                    
                    
                </form>
                <br>
                <button type = "submit">Create Account</button>
                <br>
                <p>Already have an account? <a>Log in</a></p>
            </div>
            
            
            
        </div>
    </div>
</body>
</html>
